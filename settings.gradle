pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

// Starcatcher is consumed as a normal maven dependency from the Modrinth maven
// (see the dependencies block in build.gradle). The previous composite build over a
// local SourceCode/starcatcher-2.3-1.20.1 checkout has been removed: it was only needed
// to compile starcatcher's mixins against dev mappings for runClient, which this project
// no longer relies on.
//
// Consequence: `gradlew runClient` is no longer expected to work with the host mod loaded.
// `gradlew build` (the released jar) is unaffected, because starcatcher is compileOnly.
