# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: the moddev `createMinecraftArtifacts` task is incompatible with the
# configuration cache, which makes IntelliJ's Gradle sync fail (empty tool window).
org.gradle.configuration-cache=false

mc_version=1.21.1

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.266
neoforge_version_range=[21.1,)
loader_version_range=[4,)

parchment_mappings_version=2024.11.17
parchment_minecraft_version=1.21.1

# Mod Properties
mod_version=0.5.2

mod_id=autofishs
mod_name=AutoFishS
mod_license=MIT
mod_group_id=com.autofishs
mod_authors=cOntriButiOn
mod_description=A pure client-side minigame auto-hit assistant addon for Starcatcher (1.21.1 NeoForge)

# Host mod we build on top of.
# 2.3.14 is the last 2.3.x line for 1.21.1 NeoForge and keeps the same minigame API
# surface we target on 1.20.1 (FishingMinigameScreen.getPointerPosPrecise,
# TournamentOverlay, FishProperties.CatchInfo). 3.3.x refactored all of those away.
starcatcher_version=2.3.14-NEOFORGE-1.21.1
