# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: the legacyforge `createMinecraftArtifacts` task is incompatible with the
# configuration cache, which makes IntelliJ's Gradle sync fail (empty tool window).
org.gradle.configuration-cache=false

mc_version=1.20.1

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47.3.10,)
loader_version_range=[47,)

parchment_mappings_version=2023.09.03
parchment_minecraft_version=1.20.1

# Mod Properties
mod_version=0.5.1

mod_id=autofishs
mod_name=AutoFishS
mod_license=MIT
mod_group_id=com.autofishs
mod_authors=cOntriButiOn
mod_description=A pure client-side minigame auto-hit assistant addon for Starcatcher (1.20.1 Forge)

# Host mod we build on top of
starcatcher_version=2.3.19-FORGE-1.20.1

# starcatcher's bundled (jarJar) mod deps, re-declared for dev-run deobfuscation
neobackports_version=1.2.5
tiny_multiblock_lib_version=3.2.0
